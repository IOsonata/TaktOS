# =============================================================================
# Zephyr Kconfig settings for the KVB benchmark suite — board-agnostic.
#
# These settings apply to every Zephyr board.  Per-board overrides (e.g.
# tighter stacks for low-RAM targets, devicetree alternatives for the
# console UART) belong in boards/<board>.conf and boards/<board>.overlay
# respectively.
#
# These settings are chosen for FEATURE PARITY with the other KVB ports
# (TaktOS, FreeRTOS V11.1+, Eclipse ThreadX 6.x).  See the KVB v3.0
# comparison report's methodology section for the full rationale.
#
# Equivalent runtime safety on every kernel:
#
#   - Stack overflow detection: always-on
#       TaktOS:    sentinel paint + check at every context switch
#       FreeRTOS:  configCHECK_FOR_STACK_OVERFLOW = 2 (canary)
#       ThreadX:   TX_ENABLE_STACK_CHECKING (sentinel)
#       Zephyr:    CONFIG_STACK_SENTINEL = y (software canary checked at
#                  every context switch, every k_yield(), every tick ISR
#                  for the interrupted thread, and every thread return).
#                  CONFIG_HW_STACK_PROTECTION (MPU stack guard) is NOT
#                  enabled — STACK_SENTINEL and MPU_STACK_GUARD are
#                  mutually exclusive in NCS Kconfig, and the software
#                  sentinel is the closer parity match to the always-on
#                  canary checks the other three RTOSes perform.
#
#   - Null parameter / bad object check: always-on
#       TaktOS:    inline check at API entry, no extra frame
#       FreeRTOS:  configASSERT macro inlined at call sites
#       ThreadX:   _txe_* wrapper functions (real call frame per API)
#       Zephyr:    CONFIG_ASSERT = y, CONFIG_ASSERT_LEVEL = 2 (inline
#                  __ASSERT() in every k_* API entry, validates handles
#                  and arguments).  Zephyr does NOT track per-object
#                  validity in this build (CONFIG_OBJ_CORE = n); see the
#                  v22 methodology disclosure for the invalid_obj
#                  asymmetry between TaktOS/ThreadX (= 1) and
#                  FreeRTOS/Zephyr (= 0).
#
#   - Mutex priority inheritance: enabled
#       Zephyr:    unconditional in k_mutex (always-on in current Zephyr;
#                  no Kconfig switch — older guides referencing
#                  CONFIG_MUTEX_PRIORITY_INHERITANCE are out of date).
#                  CONFIG_PRIORITY_CEILING left at default (-127 = no
#                  cap on the inherited priority boost).
#
# Allocation strategy: static-only.  No heap, no dynamic kernel objects.

# -----------------------------------------------------------------------------
# Kernel scheduling shape
# -----------------------------------------------------------------------------
# Disable round-robin timeslicing — KVB tests rely on explicit yield to
# isolate cooperative scheduler latency from preemption events.
CONFIG_TIMESLICING=n

# 1000 Hz tick — matches every other KVB port.  TIME_SLEEP_001
# requested-vs-actual tolerance is computed against this tick period.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# 15 preemptive priority levels.  KVB defines 5 canonical levels which
# the Zephyr port maps onto Zephyr's 0..14 preemptive range
# (numerically lower = higher urgency in Zephyr):
#       KVB_PRIORITY_HIGHEST -> 0
#       KVB_PRIORITY_HIGH    -> 3
#       KVB_PRIORITY_NORMAL  -> 7
#       KVB_PRIORITY_LOW     -> 11
#       KVB_PRIORITY_LOWEST  -> 14
CONFIG_NUM_PREEMPT_PRIORITIES=15

# Leave NUM_COOP_PRIORITIES at its default (16).  Forcing it to 0 breaks
# Zephyr internals (system workqueue, BLE host stack defaults, etc.)
# that place threads at negative priorities.

# -----------------------------------------------------------------------------
# Memory model: static allocation only
# -----------------------------------------------------------------------------
# Disable the system heap.  KVB never calls k_malloc(); all kernel
# objects are caller-supplied.
CONFIG_HEAP_MEM_POOL_SIZE=0

# -----------------------------------------------------------------------------
# Optimization (matches -Os elsewhere)
# -----------------------------------------------------------------------------
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SPEED_OPTIMIZATIONS=n

# -----------------------------------------------------------------------------
# Stack overflow detection (parity)
# -----------------------------------------------------------------------------
# Software stack sentinel ON: a magic word is written at the lowest
# address of every thread's stack at thread create, then re-checked on
# every context switch (outgoing thread), every k_yield(), every tick
# ISR for the interrupted thread, and every thread-entry return.  This
# is the closest functional match to the always-on canary checks
# performed by FreeRTOS (configCHECK_FOR_STACK_OVERFLOW=2), ThreadX
# (TX_ENABLE_STACK_CHECKING), and TaktOS's per-context-switch sentinel.
#
# CONFIG_HW_STACK_PROTECTION (MPU stack guard) is intentionally OFF —
# Zephyr's NCS layer makes STACK_SENTINEL depend on !MPU_STACK_GUARD,
# so enabling both produces a Kconfig warning and silently drops one of
# them.  We keep STACK_SENTINEL because it is the apples-to-apples
# match to the canary-style checks the other three RTOSes use.
CONFIG_STACK_SENTINEL=y
CONFIG_HW_STACK_PROTECTION=n

# CONFIG_THREAD_STACK_INFO is auto-selected by STACK_SENTINEL — leave
# the explicit assignment off so Kconfig dependency resolution drives
# it.  CONFIG_INIT_STACKS (paint stacks at create time for stack-usage
# measurement, not stack-overflow detection) is OFF — none of the
# other three RTOSes do this and it would only show up as boot-time
# cost, not on the measured hot path.
CONFIG_INIT_STACKS=n

# Null-pointer dereference catch via DWT data watchpoint — left OFF
# because none of the other three RTOSes have a comparable feature.
# Enabling it would give Zephyr a hardware safety net the others lack
# and bias the comparison.
CONFIG_NULL_POINTER_EXCEPTION_DETECTION_DWT=n

# -----------------------------------------------------------------------------
# FPU
# -----------------------------------------------------------------------------
# Hard-float ABI matches the other three KVB ports
# (-mfpu=fpv4-sp-d16 -mfloat-abi=hard for arm-none-eabi-gcc).
# CONFIG_FPU_SHARING is auto-selected when CONFIG_FPU=y on multi-thread
# Zephyr builds — leave it implicit.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y

# -----------------------------------------------------------------------------
# Parameter / object validation (parity with FreeRTOS configASSERT
# and ThreadX _txe_* wrappers)
# -----------------------------------------------------------------------------
# CONFIG_ASSERT_LEVEL = 2 (default when CONFIG_ASSERT=y) inlines
# __ASSERT() at every k_* API entry that validates an argument.
# Equivalent in spirit to the always-on parameter checks in
# FreeRTOS configASSERT() and ThreadX _txe_* wrappers.
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# -----------------------------------------------------------------------------
# Mutex priority inheritance is unconditional in current Zephyr — no
# Kconfig switch.  See the parity comment at the top of this file.
# CONFIG_PRIORITY_CEILING (default -127 = no cap) sets the maximum
# priority boost the kernel will apply to a holder.  Left at default
# for parity with the unconditional inheritance the other kernels
# provide.

# -----------------------------------------------------------------------------
# Console / log routing for KVB benchmark output
# -----------------------------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
# Suppress Zephyr's startup banner so the KVB log starts clean — every
# other KVB port writes the suite header as its very first UART output.
CONFIG_BOOT_BANNER=n

# Disable Zephyr's logging subsystem — KVB writes its own line-oriented
# log directly via printk.  Mirrors how the other ports use raw UART
# without an intermediate logging framework.
CONFIG_LOG=n

# -----------------------------------------------------------------------------
# Application thread stack (KVB runner runs in main())
# -----------------------------------------------------------------------------
# The runner runs in main().  KVB_RUNNER_STACK_SIZE in
# kvb_config_zephyr.h is the USABLE stack size; the Zephyr main
# thread's stack is sized via this Kconfig and must match.
CONFIG_MAIN_STACK_SIZE=2048

# -----------------------------------------------------------------------------
# Idle thread stack
# -----------------------------------------------------------------------------
CONFIG_IDLE_STACK_SIZE=512

# -----------------------------------------------------------------------------
# C library — picolibc (NCS default for nrf52)
# -----------------------------------------------------------------------------
# NCS selects CONFIG_PICOLIBC=y as its default libc on Cortex-M targets;
# we accept that default rather than forcing CONFIG_NEWLIB_LIBC=y.  The
# KVB port uses only printk() (Zephyr-internal, not libc-routed) and
# snprintf() / memset() / memcpy() at thread-init time — none of which
# are on the measurement hot path.  Choice of libc therefore has no
# observable effect on any KVB throughput number.
#
# Float-aware printf is OFF in this build (KVB never formats floats).
CONFIG_PICOLIBC_IO_FLOAT=n

# -----------------------------------------------------------------------------
# Hardware features explicitly NOT used by KVB
# -----------------------------------------------------------------------------
CONFIG_BT=n
CONFIG_NETWORKING=n
CONFIG_USB_DEVICE_STACK=n
