# =============================================================================
# Zephyr Kconfig settings for KVB benchmark on nRF54L15-DK.
#
# v2: removed three symbols that were either auto-derived or removed from
# the current Zephyr Kconfig tree:
#
#   - CONFIG_PREEMPT_ENABLED=y           (def_bool, auto from NUM_PREEMPT_PRIORITIES)
#   - CONFIG_NUM_COOP_PRIORITIES=0       (breaks Zephyr defaults that assume
#                                         negative priorities exist; leave at
#                                         default 16)
#   - CONFIG_KERNEL_MEM_POOL=n           (removed in Zephyr 2.x; setting
#                                         HEAP_MEM_POOL_SIZE=0 alone disables
#                                         the heap)
#
# These settings are chosen for FEATURE PARITY with the other KVB ports
# (TaktOS, FreeRTOS V11.1+, Eclipse ThreadX 6.x).  See the KVB v3.0
# comparison report's methodology section for the full rationale.
#
# Equivalent runtime safety on every kernel:
#
#   - Stack overflow detection: always-on
#       TaktOS:    sentinel paint + check at every context switch
#       FreeRTOS:  configCHECK_FOR_STACK_OVERFLOW = 2 (canary)
#       ThreadX:   TX_ENABLE_STACK_CHECKING (sentinel)
#       Zephyr:    CONFIG_STACK_SENTINEL = y (canary at every switch)
#                  CONFIG_HW_STACK_PROTECTION = y (M33 MPU stack guard)
#
#   - Null parameter / bad object check: always-on
#       TaktOS:    inline check at API entry, no extra frame
#       FreeRTOS:  configASSERT macro inlined at call sites
#       ThreadX:   _txe_* wrapper functions (real call frame per API)
#       Zephyr:    CONFIG_ASSERT = y (inline assertions in k_* APIs)
#
#   - Mutex priority inheritance: enabled
#       Zephyr:    unconditional in k_mutex (no Kconfig — always-on
#                  in current Zephyr; older guides mention a removed
#                  CONFIG_MUTEX_PRIORITY_INHERITANCE symbol)

# -----------------------------------------------------------------------------
# Kernel scheduling shape
# -----------------------------------------------------------------------------
# CONFIG_PREEMPT_ENABLED is auto-derived from NUM_PREEMPT_PRIORITIES > 0.
# Setting NUM_PREEMPT_PRIORITIES=15 (the default) is enough.

# Disable round-robin timeslicing — KVB tests rely on explicit yield to
# isolate cooperative scheduler latency from preemption events.  TaktOS
# and ThreadX KVB builds also disable timeslicing.
CONFIG_TIMESLICING=n

# 1000 Hz tick — matches every other KVB port.  TIME_SLEEP_001
# requested-vs-actual tolerance is computed against this tick period.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# Leave NUM_COOP_PRIORITIES at its default (16).  Zephyr internals
# (system workqueue, BLE host stack defaults, etc.) place several threads
# at negative priorities; forcing NUM_COOP_PRIORITIES=0 breaks those
# placements at link time.  KVB does not need cooperative priorities
# itself — its priority mapping uses preemptive 0..14 — but the
# infrastructure around KVB does.

# 15 preemptive priority levels.  KVB uses 5 canonical levels
# (LOWEST..HIGHEST) which the Zephyr port maps into 1..14.
CONFIG_NUM_PREEMPT_PRIORITIES=15

# -----------------------------------------------------------------------------
# Memory model: static allocation only
# -----------------------------------------------------------------------------
# Setting HEAP_MEM_POOL_SIZE=0 instructs Zephyr not to define the
# system heap at all.  k_malloc() is not used by KVB; all kernel
# objects are caller-supplied.  Matches TaktOS (inline-in-handle),
# FreeRTOS V11+ (static handles + heap_4 fallback for the V11 ARM_CM0
# split-port quirk on M0 — does not apply on M33), and ThreadX
# (port-private static slot pool).
CONFIG_HEAP_MEM_POOL_SIZE=0

# -----------------------------------------------------------------------------
# Stack overflow detection (parity)
# -----------------------------------------------------------------------------
CONFIG_STACK_SENTINEL=y
# nRF54L15 is Cortex-M33 — full ARMv8-M MPU available; use HW stack
# protection in addition to the sentinel.  TaktOS production builds on
# M33 use the same MPU stack guard region, so this is feature-parity
# (NOT a Zephyr-only advantage).  FreeRTOS and ThreadX rely on the
# sentinel only on this target.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y

# -----------------------------------------------------------------------------
# Parameter / object validation (parity with FreeRTOS configASSERT
# and ThreadX _txe_* wrappers)
# -----------------------------------------------------------------------------
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2

# -----------------------------------------------------------------------------
# Mutex semantics
# -----------------------------------------------------------------------------
# k_mutex priority inheritance is ALWAYS-ON in current Zephyr (4.x).
# There is no Kconfig switch — the priority-boost code in kernel/mutex.c
# is unconditional.  Older guides referencing CONFIG_MUTEX_PRIORITY_
# INHERITANCE are out of date; the symbol was removed and the feature
# made unconditional.
#
# Parity with TaktOS (PI required), FreeRTOS (xSemaphoreCreateRecursive
# Mutex with configUSE_MUTEXES=1 inherits priority), ThreadX (TX_INHERIT
# attribute on tx_mutex_create) is therefore intrinsic to k_mutex,
# not something this prj.conf needs to enable.
#
# CONFIG_PRIORITY_CEILING (default -128 = unbounded inheritance) sets
# the cap on how high the kernel will boost the holder's priority.  Left
# at default for parity with the unconditional inheritance the other
# kernels provide.

# -----------------------------------------------------------------------------
# Console / log routing for KVB benchmark output
# -----------------------------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
# Suppress Zephyr's startup banner so the KVB log starts clean — every
# other KVB port writes the suite header as its very first UART output.
CONFIG_BOOT_BANNER=n

# Disable Zephyr's logging subsystem — KVB writes its own line-oriented
# log directly via printk.  Mirrors how the other ports use raw UART
# without an intermediate logging framework.
CONFIG_LOG=n

# -----------------------------------------------------------------------------
# Application thread stack (KVB runner runs in main())
# -----------------------------------------------------------------------------
# The runner runs in main().  KVB_RUNNER_STACK_SIZE in
# kvb_config_nrf54l15dk_zephyr.h is the USABLE stack size; the Zephyr
# main thread's stack is sized via this Kconfig and must match.
CONFIG_MAIN_STACK_SIZE=2048

# -----------------------------------------------------------------------------
# Idle thread stack
# -----------------------------------------------------------------------------
CONFIG_IDLE_STACK_SIZE=512

# -----------------------------------------------------------------------------
# C library — newlib for printf/snprintf parity with FreeRTOS/ThreadX builds
# -----------------------------------------------------------------------------
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=n

# -----------------------------------------------------------------------------
# Hardware features explicitly NOT used by KVB
# -----------------------------------------------------------------------------
CONFIG_BT=n
CONFIG_NETWORKING=n
CONFIG_USB_DEVICE_STACK=n
