# =============================================================================
# Thread-Metric strict-parity Zephyr configuration.
#
# Matched baseline against FreeRTOS / TaktOS / ThreadX:
#   - 1 kHz tick rate                 matches FreeRTOS configTICK_RATE_HZ=1000
#                                     and ThreadX TX_TIMER_TICKS_PER_SECOND=1000.
#   - Tickless OFF                    matches the others (tick interrupt every ms).
#   - Size-optimized                  matches -Os used everywhere else.
#   - Single-CPU                      all RTOSes run single-core.
#   - No timeslicing                  matches FreeRTOS configUSE_TIME_SLICING=0
#                                     and ThreadX TX_DISABLE_PREEMPTION_THRESHOLD.
#
# Memory protection  MPU OFF in this round:
#   FreeRTOS uses ARM_CM4F port (no MPU). TaktOS calls TaktOSInit with
#   HandlerBaseAddr=0u (MPU code path not bound). ThreadX uses cortex_m4/gnu
#   standard port (no MPU integration). All three  zero MPU overhead.
#   Zephyr matches with CONFIG_MPU=n / CONFIG_ARM_MPU=n. A separate MPU-ON
#   round will follow once the other three RTOSes' MPU paths are wired up.
#
# API-entry runtime validation  each kernel ships with its own
# design choice for where the kernel / application responsibility
# line is drawn.  This round keeps every kernel's native regime in
# place; see the KVB comparison report 3.4 for the full breakdown.
# Quick summary of hot-path validation work:
#   TaktOS    hot-path checks at every public API entry: NULL on the
#             handle (and pData on Queue Send / Receive), non-owner
#             unlock rejection on every MutexUnlock (returns
#             ERR_INVALID, no trap), and 4-byte alignment of pData on
#             Queue Send / Receive (returns ERR_ALIGN; converts an
#             unaligned-access HardFault on Cortex-M0 into a clean
#             error return).  Init APIs additionally range-check
#             MaxCount / Initial / Ceiling / ItemSize / Capacity and
#             pStorage alignment, but Init is not on the hot loop.
#             Slow/blocking paths add an ISR-context guard and a
#             scheduler-ring corruption-detect inside TaktBlockTask.
#             TaktOS does not re-validate caller arguments beyond
#             this list  the application owns its own argument
#             validation.  Matches the IEC 61508 SIL 2 / ISO 26262
#             ASIL D boundary TaktOS targets.
#   FreeRTOS  middle layer of caller-misuse defence.  configASSERT
#             inlined 3-4 times per queue / sem / mutex call (NULL +
#             item-size + scheduler-state invariants).
#   ThreadX   exhaustive caller-misuse defence.  _txe_* wrapper adds
#             a real C call frame plus 4-5 checks (NULL + object-ID +
#             wait-option + timer-thread + ISR).  Heaviest of the four.
#   Zephyr    parameter validation in current Zephyr is split across
#             two mechanisms; both are pinned ON for this build to
#             match what the other three RTOSes carry.
#             (a) CHECKIF()  returned-error layer.  Controlled by
#             the Kconfig choice "Error checking behavior for CHECK
#             macro" (sys/check.h): RUNTIME_ERROR_CHECKS (default,
#             returns -EINVAL on failure), ASSERT_ON_ERRORS (traps
#             via __ASSERT_NO_MSG), or NO_RUNTIME_CHECKS (compile
#             out).  Pinned RUNTIME_ERROR_CHECKS=y explicitly so
#             prior build state / menuconfig cannot leave it
#             disabled.  Coverage is narrow on the public surface
#             (k_sem_init count/limit, k_mutex_unlock non-owner /
#             unlocked-mutex, k_msgq_cleanup busy).
#             (b) __ASSERT()  trap-on-misuse layer.  Controlled by
#             CONFIG_ASSERT.  This is where most of Zephyr's API-
#             entry runtime checks actually live in current Zephyr:
#             k_sem_take ISR-vs-timeout, k_mutex_lock / k_mutex_unlock
#             ISR + lock-count, k_msgq_put / k_msgq_get ISR-vs-timeout
#             + internal pointer.  Pinned CONFIG_ASSERT=y so this
#             layer remains active  setting it n compiles every
#             __ASSERT out and leaves a strictly weaker validation
#             surface than FreeRTOS / ThreadX / TaktOS.  Caveat:
#             CONFIG_ASSERT=y also enables __ASSERTs inside the
#             scheduler / spinlock / wait-queue helpers that the
#             others have no equivalent of  there is no Kconfig
#             granularity to keep the API-entry checks while
#             dropping the internal-debug ones, so we accept the
#             parity-correct build (~519 k -> ~205 k SEM throughput)
#             over a lighter but strictly-less-checked one.
# Stack overflow detection is also on for every kernel:
#   FreeRTOS  configCHECK_FOR_STACK_OVERFLOW=2 (canary on every switch)
#   ThreadX   TX_ENABLE_STACK_CHECKING (canary on every switch)
#   TaktOS    always-on guard-word check (auto-defined ARMv6-M / ARMv7-M;
#             ARMv8-M uses hardware PSPLIM)
#   Zephyr    CONFIG_STACK_SENTINEL=y (canary)
# CONFIG_OBJ_CORE is not set, so Zephyr does not track per-object
# validity (invalid_obj=0); same as FreeRTOS, vs invalid_obj=1 on
# TaktOS / ThreadX.
#
# FPU  ON: matches FreeRTOS / TaktOS / ThreadX (-mfpu=fpv4-sp-d16 on M4,
#   fpv5-sp-d16 on M33; -mfloat-abi=hard everywhere).
#
# Upstream Zephyr's "thread_metric" benchmark also uses a 100 Hz tickless
# config to win raw-throughput benchmarks; we keep 1000 Hz tick-driven here:
#   CONFIG_TICKLESS_KERNEL=y          <-- removed: matches others (tick-driven)
#   CONFIG_SYS_CLOCK_TICKS_PER_SEC=100 <-- removed: matches others (1000 Hz)
# =============================================================================

# --- Tick rate and tickless ---
CONFIG_TICKLESS_KERNEL=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000

# --- Optimization (matches -Os elsewhere) ---
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SPEED_OPTIMIZATIONS=n

# --- Scheduler ---
CONFIG_TIMESLICING=n
CONFIG_MP_MAX_NUM_CPUS=1
CONFIG_THREAD_LOCAL_STORAGE=n

# --- MPU OFF this round (parity with FreeRTOS / TaktOS / ThreadX) ---
CONFIG_MPU=n
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n

# --- Software safety checks ON (parity with the other three RTOSes) ---
# Stack canary: written at thread create, checked on every context switch.
# Equivalent to FreeRTOS configCHECK_FOR_STACK_OVERFLOW=2, ThreadX
# TX_ENABLE_STACK_CHECKING, and TaktOS's always-on guard-word check.
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=n
CONFIG_NULL_POINTER_EXCEPTION_DETECTION_DWT=n

# Parameter / handle validation at API entry: parity with FreeRTOS
# configASSERT, ThreadX _txe_* wrappers, and TaktOS's API-entry
# checks.  Current Zephyr splits validation across TWO mechanisms;
# both need to be enabled to match what the other three RTOSes carry.
#
# 1. CHECKIF()  returned-error path.  Controlled by the Kconfig
#    choice "Error checking behavior for CHECK macro" (sys/check.h):
#    RUNTIME_ERROR_CHECKS (default; run the check, return -EINVAL),
#    ASSERT_ON_ERRORS (trap via __ASSERT_NO_MSG), or NO_RUNTIME_CHECKS
#    (compile out).  Setting RUNTIME_ERROR_CHECKS=y explicitly is
#    more robust than relying on the default, because prior build
#    state / menuconfig can leave the choice resolved differently.
#    CHECKIF coverage on the public surface is narrow: k_sem_init
#    invalid count/limit, k_mutex_unlock non-owner / unlocked-mutex,
#    k_msgq_cleanup busy.
#
# 2. __ASSERT()  trap-on-misuse path.  Controlled by CONFIG_ASSERT
#    (gates __ASSERT / __ASSERT_NO_MSG via __assert.h's __ASSERT_ON).
#    This is where most of the API-entry runtime checks actually
#    live in current Zephyr: k_sem_take ISR-vs-timeout, k_mutex_lock
#    / k_mutex_unlock ISR + lock-count, k_msgq_put / k_msgq_get
#    ISR-vs-timeout + internal pointer.  Setting CONFIG_ASSERT=n
#    removes ALL of these checks  the resulting build has strictly
#    less validation than FreeRTOS configASSERT, ThreadX _txe_*, or
#    TaktOS's API-entry checks.  We pin CONFIG_ASSERT=y for parity.
#    CONFIG_ASSERT_LEVEL defaults to 2 (check + print + halt); the
#    benchmark hot-path cost is the same as level 1 (check + print).
#
# Caveat: CONFIG_ASSERT=y also enables __ASSERTs inside scheduler /
# spinlock / wait-queue helpers that the other three RTOSes ship no
# equivalent of.  An earlier round measured a SEM throughput drop
# from 519 k to 205 k p/s when CONFIG_ASSERT was first turned on
# part of that gap is API-entry parity work the others also pay,
# part is internal-debug instrumentation the others do not.  Without
# Kconfig granularity to split the two we accept the parity-correct
# build over the lighter-but-unfair one.
CONFIG_RUNTIME_ERROR_CHECKS=y
CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2


# --- FPU on (matches Cortex-M4F / M33 with FPU) ---
CONFIG_FPU=y
CONFIG_FPU_SHARING=n

# --- Console (printk over UART) ---
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_STDOUT_CONSOLE=n
CONFIG_PRINTK=y

# --- No logging overhead (matches other RTOSes  no debug prints) ---
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_BOOT_BANNER=n

# --- libc ---
CONFIG_PICOLIBC=y

# --- TM5 software interrupt support (only needed if InterruptProcessing tests
#     are run; harmless for the others, kept for symmetry) ---
CONFIG_IRQ_OFFLOAD=y

# --- Heap: zero. All Thread-Metric storage is static. ---
CONFIG_HEAP_MEM_POOL_SIZE=0

# --- Main thread stack: large enough for tm_main() to call test_init_fn() ---
CONFIG_MAIN_STACK_SIZE=2048
